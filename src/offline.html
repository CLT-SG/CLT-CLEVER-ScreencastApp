<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <link rel="stylesheet" type="text/css" href="assets/js/fullpagejs/fullpage.min.css" />
  <link rel="stylesheet" type="text/css" href="assets/css/examples.css" />
  <link rel="stylesheet" type="text/css" href="assets/css/fontawesome.min.css" />
  <script>
    if (typeof module === 'object') {
      window.module = module;
      module = undefined;
    }
  </script>
  <style>
    /* Style for our header texts
    * --------------------------------------- */
    h1 {
      font-size: 5em;
      font-family: arial, helvetica;
      color: #fff;
      margin: 0;
      padding: 40px 0 0 0;
    }

    .intro p {
      color: #fff;
      padding: 40px 0 0 0;
    }

    .wrap {
      margin-left: auto;
      margin-right: auto;
      width: 980px;
      position: relative;
      padding: 20px 0 20px 0;
    }

    .wrap h1 {
      font-size: 2.3em;
      color: #333;
      padding: 30px 0 10px 0;
    }

    .wrap p {
      font-size: 16px;
      padding: 0 0 10px 0;
    }

    .box {
      display: block;
      background: #f2f2f2;
      border: 1px solid #ccc;
      padding: 20px;
      margin: 20px 0;
    }

    /* Centered texts in each section
    * --------------------------------------- */
    .section {
      text-align: center;
    }


    /* Bottom menu
    * --------------------------------------- */
    #infoMenu li a {
      color: #000;
    }
  </style>
</head>

<body>
  <div id="fullpage">
    <div class="section " id="section0">
      <div class="slide">
        <div class="off">
          <img src="assets/media/off-cloud.png" class="offline-img slide-fwd-center" />
          <h3>Clever Cast Server is unavailable now.</h3>
          <h3>Please check as follows.</h3>
          <h4>1. Check this pc or cast server network connection and make sure LAN cable is connected.</h4>
          <h4>2. Make sure server is turned on.</h4>
          <h4>3. Check network switch and make sure it's turned on.</h4>
        </div>
      </div>
      <div class="slide">
        <div class="off">
          <video id="videads" data-autoplay autoplay muted controls="false" width="720px">
            <source src="assets/media/videoplayback1.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
      <div class="slide">
        <div class="off">
          <h3>CLEVER - Screen Cast</h3>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="assets/js/jquery.min.js"></script>
  <script type="text/javascript" src="assets/js/fullpagejs/fullpage.min.js"></script>

  <script type="text/javascript">
    if (typeof (require) != "undefined") {
      var path = require('path');
      var ipcRenderer = require("electron").ipcRenderer;
    }
    const updateOnlineStatus = () => {
      ipcRenderer.send('server-status', navigator.onLine)
      console.log(navigator.onLine)
    }
    window.addEventListener('online', updateOnlineStatus)
    window.addEventListener('offline', updateOnlineStatus)
    var slideTimeout;
    $('#fullpage').fullpage({
      anchors: ['firstPage'],
      sectionsColor: ['#ffffff'],
      autoScrolling: false,
      css3: true,
      fitToSection: false,
      scrollOverflow: false,
      slidesNavigation: true,
      slidesNavPosition: 'bottom',
      afterRender: function () {
        //on page load, start the slideshow
        slideTimeout = setInterval(function () {
          $.fn.fullpage.moveSlideRight();
        }, 60000);
      },
      onLeave: function (index, direction) {
        //after leaving section 1 (home) and going anywhere else, whether scrolling down to next section or clicking a nav link, this SHOULD stop the slideshow and allow you to navigate the site...but it does not
        if (index == '1') {
          clearInterval(slideTimeout);
        }
      }
    });
  </script>
</body>

</html>
