<!DOCTYPE html>
<html lang="en">

<head>
  <title>CLEVER - Remote Desktop</title>

  <script>
    if (typeof module === 'object') {
      window.module = module
      module = undefined
    }
  </script>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    if (typeof (require) != "undefined") {
      var ipaddress
      var {
        ipcRenderer
      } = require('electron')
      var websockify = require('node-websockify')
      var os = require('os')
      var computerName = os.hostname()
      //get local ip address
      var os = require('os')
      var ifaces = os.networkInterfaces()
      Object.keys(ifaces).forEach(function (ifname) {
        var alias = 0

        ifaces[ifname].forEach(function (iface) {
          if ('IPv4' !== iface.family || iface.internal !== false) {
            // skip over internal (i.e. 127.0.0.1) and non-ipv4 addresses
            return
          }

          if (alias >= 1) {
            // this single interface has multiple ipv4 addresses
            console.log(ifname + ':' + alias, iface.address)
          } else {
            // this interface has only one ipv4 adress
            ipaddress = iface.address
          }
          ++alias
        })
      })
    }
  </script>
  <script src="assets/js/jquery.min.js"></script>
</head>

<body>
  <div class="top top-1">CLEVER</div>
  <div class="top top-2">SCREEN CAST & REMOTE CONTROL</div>
  <div class="container-config">
    <div>Server Url :</div>
    <input type="text" id="url" class="host-input" value="192.168.1.88"></input>
    <div>Server Port :</div>
    <input type="text" id="port" class="host-input" value="9100"></input>
    <button id="reset" class="reset-btn">Reset default</button>
  </div>
  <div class="container-button">
    <button id="refresh-screen" disabled class="setup">Stop</button>
    <button id="share-screen" class="setup child-h">Connect</button>
    <!-- local/remote videos container -->
  </div>
</body>

<script>
  $('#share-screen').click(function () {
    var host = $('#url').val()
    var port = $('#port').val()
    if (host == '') {
      alert('Please insert Server url')
    } else if (port == '') {
      alert('Please insert Server port')
    } else {
      localStorage.setItem("host", host)
      localStorage.setItem("port", port)
      $('#refresh-screen').attr("disabled", false)
      $('#share-screen').attr("disabled", true)
      var hostserver = 'http://' + host + ':' + port + '/castsave'

      websockify({
        target: ipaddress + ':5900',
        source: '127.0.0.1:8080'
      })
      myTrayImg('publish')
      $.ajax({
        url: hostserver,
        type: "POST",
        data: {
          devicename: computerName,
          ipadd: ipaddress
        },
        success: function (data, textStatus, jqXHR) {
          console.log(data)
          //data - response from server
        },
        error: function (jqXHR, textStatus, errorThrown) {

        }
      });
    }
  })

  $('#refresh-screen').click(function () {
    myTrayImg('stopped')
    location.reload()
  })

  function myTrayImg(icon) {
    ipcRenderer.send('tray-icon', icon)
  }

  $(document).ready(function () {
    $('#reset').on('click', function () {
      $('#url').val('localhost')
      $('#port').val('9100')
    })
    if (localStorage.getItem("host") === null || localStorage.getItem("host") == '') {
      $('#url').val('localhost')
    } else {
      $('#url').val(localStorage.getItem("host"))

    }
    if (localStorage.getItem("port") === null || localStorage.getItem("port") == '') {
      $('#port').val('9100')
    } else {
      $('#port').val(localStorage.getItem("port"))
    }
  })
</script>

</html>
