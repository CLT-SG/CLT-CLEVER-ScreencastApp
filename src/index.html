<head>
  <title>CLEVER - ScreenCast & VNC</title>

  <script>
    if (typeof module === 'object') {
      window.module = module
      module = undefined
    }
  </script>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">

  <script>
    if (typeof (require) != "undefined") {
      var ipaddress
      var {
        ipcRenderer,
        remote
      } = require('electron')
      var websockify = require('node-websockify')
      var os = require('os')
      var computerName = os.hostname()
      var customTitlebar = require('custom-electron-titlebar')
      const netList = require('network-list')
      const portscanner = require('portscanner')
      const isReachable = require('is-reachable')
      var nodecmd = require('node-cmd')
      const path = require('path')
      var cleveraddress
      var cleverport = 9100
      var cleverlist = []
      //get local ip address
      var os = require('os')
      var ifaces = os.networkInterfaces()
      netList.scan({
        vendor: false
      }, (err, devices) => {
        devices.forEach(function (iplist) {
          portscanner.findAPortInUse(cleverport, iplist.ip, function (error, status) {
            // Status is 'open' if currently in use or 'closed' if available
            var hostserver = 'http://' + iplist.ip + ':' + cleverport + '/castsave'
            $.ajax({
              url: hostserver,
              type: "POST",
              data: {
                devicename: computerName,
                ipadd: ipaddress
              },
              success: function (data, textStatus, jqXHR) {
                //data - response from server
              },
              error: function (jqXHR, textStatus, errorThrown) {

              }
            })
            Object.keys(ifaces).forEach(function (ifname) {
              var alias = 0

              ifaces[ifname].forEach(function (iface) {
                if ('IPv4' !== iface.family || iface.internal !== false) {
                  // skip over internal (i.e. 127.0.0.1) and non-ipv4 addresses
                  return
                }

                if (alias >= 1 || iplist.ip == '192.168.1.253') {
                  // this single interface has multiple ipv4 addresses
                  //console.log(ifname + ':' + alias, iface.address)
                } else {
                  // this interface has only one ipv4 adress
                  ipaddress = iface.address
                  nodotip = ipaddress.split('.').join("")
                  var pathdir = process.env.PORTABLE_EXECUTABLE_DIR || path.join(__dirname, '../')
                  const syncData = nodecmd.run(
                    pathdir + '/ffmpeg/bin/ffmpeg -re -f dshow -i video="screen-capture-recorder" ' +
                    '-vcodec libx264 -r 35 -acodec libvo_aacenc -ac 2 ' +
                    '-ar 44100 -pix_fmt yuv420p -tune zerolatency ' +
                    '-preset ultrafast -f flv "rtmp://' + iplist.ip + ':1935/screencast/' +
                    nodotip + '"',
                    function (err, data, stderr) {
                      console.log('data : ', data)
                      console.log('stderr : ', stderr)
                    })
                }
                ++alias
              })
            })
          })
        })
      })
    }
  </script>
  <script src="assets/js/jquery.min.js"></script>
</head>

  $('#refresh-screen').click(function () {
    myTrayImg('stopped')
    if ($('#auto').is(':checked')) {
      $("#share-screen").show()
    }
    $('#refresh-screen').attr("disabled", true)
    $('#share-screen').attr("disabled", false)
    websockify({
      target: ipaddress + ':6000',
      source: '127.0.0.1:9090'
    })
  })

  $('#restart-screen').click(function () {
    location.reload(true);
  })

  function myTrayImg(icon) {
    ipcRenderer.send('tray-icon', icon)
  }

  $(document).ready(function () {
    new customTitlebar.Titlebar({
      backgroundColor: customTitlebar.Color.fromHex('#770055'),
      maximizable: false,
      hideWhenClickingClose: true,
      minimizable: false,
      titleHorizontalAlignment: 'right'
    })
    $('#reset').on('click', function () {
      $('#url').val('localhost')
      $('#port').val('9100')
    })
    if (localStorage.getItem("host") === null || localStorage.getItem("host") == '') {
      $('#url').val('localhost')
    } else {
      $('#url').val(localStorage.getItem("host"))

    }
    if (localStorage.getItem("port") === null || localStorage.getItem("port") == '') {
      $('#port').val('9100')
    } else {
      $('#port').val(localStorage.getItem("port"))
    }
    if ($('#auto').is(':checked')) {
      myTrayImg('publish')
      websockify({
        target: ipaddress + ':5900',
        source: '127.0.0.1:8080'
      })
      $("#share-screen").hide()
      $('#refresh-screen').attr("disabled", false)
    } else {
      $("#share-screen").show()
      $('#refresh-screen').attr("disabled", true)
    }
    $('#auto').click(function () {
      $("#share-screen").toggle(!this.checked)
      if (!this.checked) {
        $('#refresh-screen').attr("disabled", true)
      } else {
        myTrayImg('publish')
        $('#refresh-screen').attr("disabled", false)
      }
    })
  })
