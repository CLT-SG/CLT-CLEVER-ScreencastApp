<!DOCTYPE html>
<html lang="en">

<head>
  <title>CLEVER - ScreenCast & VNC</title>

  <script>
    if (typeof module === 'object') {
      window.module = module
      module = undefined
    }
  </script>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/jquery.min.js"></script>

  <script>
    if (typeof (require) != "undefined") {
      var rtAudio
      var {
        ipcRenderer,
        remote
      } = require('electron')
      var fs = require('fs')
      var path = require('path')
      var moment = require('moment')
      var os = require('os')
      var computerName = os.hostname()
      var customTitlebar = require('custom-electron-titlebar')
      var config = require(path.join(__dirname, '..', 'config.js'))
      var cleveraddress
      var cleverport = 9100
      var ipaddress
      var cleverlist = ['192.168.1.208', '192.168.1.100']

      //get local ipv4 address
      ipcRenderer.invoke('get-ipaddress', 'ippp').then((result) => {
        ipaddress = result
      })
    }


    //send information to CLEVER controller
    function sendInfo(hostadd) {
      var hostserver = 'http://' + hostadd + ':' + cleverport + '/castsave'
      $.ajax({
        url: hostserver,
        type: "POST",
        timeout: 5000,
        data: {
          devicename: computerName,
          ipadd: ipaddress
        },
        success: function (data, textStatus, jqXHR) {
          console.log('PC NAME: ' + computerName)
          console.log('IP ADDRESS: ' + ipaddress)
          //data - response from server
        },
        error: function (jqXHR, textStatus, errorThrown) {
          console.log('Unable to connect this clever')
        }
      })
    }
  </script>
</head>

<body>
  <div class="top top-1">CLEVER</div>
  <div class="top top-2">ScreenCast & VNC</div>
  <div class="container-button">
    <input type="checkbox" id="auto" class="setup-chkbx" checked disabled>
    <label for="auto" style="font-size:115%;display:inline;">Auto connect</label><br>
    <input type="checkbox" id="audio" class="setup-chkbx" checked>
    <label for="audio" style="font-size:115%;display:inline;">Audio & Mic</label><br>
    <input type="checkbox" id="startup" class="setup-chkbx">
    <label for="startup" style="font-size:115%;display:inline;">Start ScreenCast when start-up</label><br>
  </div>
  <div class="container-button">
    <button id="restart-screen" class="setup smaller">Restart</button>
  </div>
  <div class="copyright">
    <img src="assets/images/logo.png" class="clt-logo"></img>
    <div class="copyright-desc">Copyright © 2000-Present, Closed-loop. All right reserved | Version:</div>
  </div>
</body>

<script>

  $('.copyright-desc').text('Copyright © 2000-' + new Date().getFullYear() +
    ', Closed-loop. All right reserved | Version: ' + remote.app.getVersion() + ' ' + ' | www.closed-loop.biz')

  $('#share-screen').click(function () {
    $('#share-screen').hide()
    $('#refresh-screen').show()
    myTrayImg('publish')
  })

  $('#restart-screen').click(async function () {
    ipcRenderer.invoke('reload', 'reload')
  })

  $(document).ready(function () {
    new customTitlebar.Titlebar({
      backgroundColor: customTitlebar.Color.fromHex('#770055'),
      maximizable: false,
      hideWhenClickingClose: true,
      minimizable: false,
      titleHorizontalAlignment: 'right'
    })

    $('#reset').on('click', function () {
      $('#url').val('localhost')
      $('#port').val('9100')
    })

    if ($('#auto').is(':checked')) {
      sendInfo(cleverlist)

      myTrayImg('publish')

      setTimeout(() => {
        ipcRenderer.invoke('port-extended', 'msg').then((result) => {
          console.log(result)
        })
      }, 5000)
      $("#share-screen").hide()
      $('#refresh-screen').attr("disabled", false)
    } else {
      $("#share-screen").show()
      $('#refresh-screen').attr("disabled", true)
    }

    $('#auto').click(function () {
      if (!this.checked) {
        $("#share-screen").show()
        $('#refresh-screen').hide()
      } else {
        myTrayImg('publish')
        $("#share-screen").hide()
        $('#refresh-screen').show()
      }
    })

    //audio and mic setup
    if (config.audio) {
      $('#audio').prop('checked', true)
    } else {
      $('#audio').prop('checked', false)
    }

    //save startup settings and pass to ipc main
    $('#audio').click(function () {
      if (!this.checked) {
        ipcRenderer.invoke('save-config', 'audio', 'exports.audio = false', this.checked)
      } else {
        ipcRenderer.invoke('save-config', 'audio', 'exports.audio = true', this.checked)
      }
      setTimeout(function () {
        ipcRenderer.invoke('restartapp', 'restartapp')
      }, 2000)
    })

    //auto startup setup
    if (config.autostartup) {
      $('#startup').prop('checked', true)
    } else {
      $('#startup').prop('checked', false)
    }

    //save startup settings and pass to ipc main
    $('#startup').click(function () {
      if (!this.checked) {
        ipcRenderer.invoke('save-config', 'autostartup', 'exports.autostartup = false', this.checked)
      } else {
        ipcRenderer.invoke('save-config', 'autostartup', 'exports.autostartup = true', this.checked)
      }
    })
  })

  function myTrayImg(icon) {
    ipcRenderer.invoke('tray-icon', icon)

  }
</script>

</html>
