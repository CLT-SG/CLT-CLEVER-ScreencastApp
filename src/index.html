<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'">
  <title>CLEVER - ScreenCast & VNC</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <header class="titlebar">
    <span class="titlebar-title">CLEVER &mdash; ScreenCast &amp; VNC</span>
    <button id="titlebar-minimize" class="titlebar-button" title="Minimize to tray">&#x2212;</button>
    <button id="titlebar-close" class="titlebar-button" title="Hide to tray">&#x2715;</button>
  </header>

  <main class="content">
    <div class="brand">
      <div class="brand-name">CLEVER</div>
      <div class="brand-sub">ScreenCast &amp; VNC</div>
    </div>

    <section class="card" aria-label="Status">
      <div class="status-row">
        <span class="label">VNC Server</span>
        <span id="vnc-status" class="value badge">Checking&hellip;</span>
      </div>
      <div class="status-row">
        <span class="label">Casting</span>
        <span id="cast-status" class="value badge">Stopped</span>
      </div>
      <div class="status-row">
        <span class="label">Viewers</span>
        <span id="viewers" class="value">0</span>
      </div>
      <div class="status-row">
        <span class="label">Device</span>
        <span id="hostname" class="value">&mdash;</span>
      </div>
      <div class="status-row">
        <span class="label">IP Address</span>
        <span id="ip-address" class="value">&mdash;</span>
      </div>
      <div id="cast-error" class="error-text"></div>
    </section>

    <section class="card" aria-label="Options">
      <div class="option-row">
        <span>Auto connect</span>
        <label class="switch">
          <input type="checkbox" id="auto-connect">
          <span class="slider"></span>
        </label>
      </div>
      <div class="option-row">
        <span>Start ScreenCast on start-up</span>
        <label class="switch">
          <input type="checkbox" id="start-on-boot">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <div class="button-row">
      <button id="restart-cast" class="action" disabled>Restart</button>
      <button id="stop-cast" class="action" disabled>Stop</button>
      <button id="start-cast" class="action">Connect</button>
    </div>

    <footer class="footer">
      <img src="assets/images/logo.png" class="clt-logo" alt="Closed-loop Technology">
      <div id="copyright" class="copyright-desc">Copyright &copy; Closed-loop. All rights reserved.</div>
    </footer>
  </main>

  <div id="notification" class="hidden">
    <p id="notification-message"></p>
    <div class="notification-buttons">
      <button id="notification-close">Close</button>
      <button id="notification-restart" class="hidden">Restart</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
