<script>
  $('.copyright-desc').text('Copyright © 2000-' + new Date().getFullYear() +
    ', Closed-loop. All right reserved | Version: ' + remote.app.getVersion() + ' | www.closed-loop.biz')
  $('#share-screen').click(function () {
    $('#share-screen').hide()
    $('#refresh-screen').show()
    myTrayImg('publish')
    /*$('#refresh-screen').attr("disabled", false)
    $('#share-screen').attr("disabled", true)
    websockify({
      target: ipaddress + ':5900',
      source: '127.0.0.1:8080'
    })
    myTrayImg('publish')*/
  })

  $('#refresh-screen').click(function () {
    $('#refresh-screen').hide()
    $('#share-screen').show()
    myTrayImg('stopped')
    /*myTrayImg('stopped')
    if ($('#auto').is(':checked')) {
      $("#share-screen").show()
    }
    $('#refresh-screen').attr("disabled", true)
    $('#share-screen').attr("disabled", false)
    websockify({
      target: ipaddress + ':6000',
      source: '127.0.0.1:9090'
    })*/
  })

  $('#restart-screen').click(function () {
    location.reload(true)
  })

  function myTrayImg(icon) {
    ipcRenderer.send('tray-icon', icon)
  }

  $(document).ready(function () {
    new customTitlebar.Titlebar({
      backgroundColor: customTitlebar.Color.fromHex('#770055'),
      maximizable: false,
      hideWhenClickingClose: true,
      minimizable: false,
      titleHorizontalAlignment: 'right'
    })
    $('#reset').on('click', function () {
      $('#url').val('localhost')
      $('#port').val('9100')
    })
    if (localStorage.getItem("host") === null || localStorage.getItem("host") == '') {
      $('#url').val('localhost')
    } else {
      $('#url').val(localStorage.getItem("host"))

    }
    if (localStorage.getItem("port") === null || localStorage.getItem("port") == '') {
      $('#port').val('9100')
    } else {
      $('#port').val(localStorage.getItem("port"))
    }
    if ($('#auto').is(':checked')) {
      myTrayImg('publish')
      websockify({
        target: ipaddress + ':5900',
        source: '127.0.0.1:8080'
      })
      $("#share-screen").hide()
      $('#refresh-screen').attr("disabled", false)
    } else {
      $("#share-screen").show()
      $('#refresh-screen').attr("disabled", true)
    }
    $('#auto').click(function () {
      if (!this.checked) {
        $("#share-screen").show()
        $('#refresh-screen').hide()
      } else {
        myTrayImg('publish')
        $("#share-screen").hide()
        $('#refresh-screen').show()
      }
    })
    if (localStorage.getItem("startup") == "on") {
      $('#startup').prop('checked', true)
    } else {
      $('#startup').prop('checked', false)
    }
    $('#startup').click(function () {
      if (!this.checked) {
        appLaunch.disable()
        localStorage.setItem("startup", "off")
      } else {
        appLaunch.enable()
        localStorage.setItem("startup", "on")
      }
    })
  })
</script>
