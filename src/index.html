<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLEVER VNC Client</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>

<body>
  <div class="window-controls">
    <div class="window-title-bar">
      <div class="window-title">CLEVER VNC Client <span id="app-version"></span></div>
      <div class="window-controls-container">
        <button id="minimize-button" class="window-control-button">
          <span class="window-control-icon">&#8211;</span>
        </button>
        <button id="maximize-button" class="window-control-button">
          <span class="window-control-icon">&#9744;</span>
        </button>
        <button id="close-button" class="window-control-button">
          <span class="window-control-icon">&#10005;</span>
        </button>
      </div>
    </div>
  </div>

  <div class="top top-1">
    CLEVER VNC Client
  </div>
  <div class="top top-2">
    Screencast & Desktop Sharing
  </div>
  <div class="top top-3">
    IP Address: <span id="ip-address">Checking...</span>
  </div>

  <div class="container-button">
    <button id="start-button">Start</button>
    <button id="stop-button">Stop</button>
  </div>

  <div class="connection-status">
    <span>Connection Status:</span>
    <span class="status-dot offline"></span>
  </div>

  <div class="container-config">
    <div class="setup">
      <input type="checkbox" class="setup-chkbx settings-checkbox" data-setting="autostartup" id="autostartup"
        checked>
      <label for="autostartup">Auto startup when PC starts</label>
    </div>
    <div class="setup">
      <input type="checkbox" class="setup-chkbx settings-checkbox" data-setting="audio" id="audio" checked>
      <label for="audio">Enable Audio</label>
    </div>
  </div>

  <button id="restart-button" class="reset-btn">Restart</button>

  <div class="copyright">
    <div class="clt-logo">
      <img src="assets/media/logo.png" alt="Company Logo" style="height: 50px;">
    </div>
    <div class="copyright-desc">
      © 2000-<span id="current-year"></span> by Closed-loop Technology Pte Ltd.<br>
      All rights reserved.
    </div>
  </div>

  <script src="renderer.js"></script>
  <script>
    // Set current year in copyright
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
