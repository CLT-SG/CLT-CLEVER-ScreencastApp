# Tag-triggered release pipeline for CLEVER Screencast.
#
# 1. Update package.json version (MAJOR.MINOR.PATCH)
# 2. Commit the version change
# 3. git tag vX.Y.Z
# 4. git push origin vX.Y.Z
# 5. This workflow installs, tests, packages, and publishes
#    GitHub Release assets required by electron-updater
#    (installers + latest.yml / latest-linux.yml / latest-mac.yml)
#
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and version check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "Release version $VERSION"

      - name: Test
        run: npm test

  release:
    name: Build and publish ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
          - name: macOS
            os: macos-latest
            args: --mac --x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Package and publish installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Drop empty CSC_LINK so electron-builder doesn't treat "" as a file path.
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.args }} --publish always

      - name: Upload build artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clever-screencast-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            build/Release/*.exe
            build/Release/*.yml
            build/Release/*.blockmap
            build/Release/*.deb
            build/Release/*.AppImage
            build/Release/*.dmg
            build/Release/*.zip
          if-no-files-found: warn
          retention-days: 14
